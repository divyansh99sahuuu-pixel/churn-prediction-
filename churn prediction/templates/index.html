<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Customer Churn Prediction</title>

<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Customer Churn Prediction</h1>

<form action="/predict" method="POST">

<div class="row">

<div class="input-box">
<label>Plan Type</label>

<select name="plan_type">

<option value="0">Basic</option>
<option value="1">Standard</option>
<option value="2">Premium</option>

</select>
</div>

<div class="input-box">
<label>Monthly Fee (£)</label>
<input type="number" step="0.01" name="monthly_fee" required>
</div>

<div class="input-box">
<label>Weekly Usage Hours</label>
<input type="number" step="0.1" name="avg_weekly_usage_hours" required>
</div>

<div class="input-box">
<label>Support Tickets</label>
<input type="number" name="support_tickets" required>
</div>

<div class="input-box">
<label>Payment Failures</label>
<input type="number" name="payment_failures" required>
</div>

<div class="input-box">
<label>Tenure (Months)</label>
<input type="number" name="tenure_months" required>
</div>

<div class="input-box">
<label>Last Login (Days Ago)</label>
<input type="number" name="last_login_days_ago" required>
</div>

</div>

<button type="submit">Predict</button>

</form>

{% if prediction_text %}

<div class="result">
{{ prediction_text }}
</div>

{% endif %}

</div>

<script src="{{ url_for('static',filename='script.js') }}"></script>

</body>
</html>
